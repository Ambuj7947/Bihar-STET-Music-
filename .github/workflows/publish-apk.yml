name: Publish Debug APK Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apk-distribution/app-debug.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-apk:
    name: Validate & Publish Prebuilt Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate APK and SHA-256 checksum
        id: validate
        run: |
          set -euo pipefail

          APK_PATH="apk-distribution/app-debug.apk"
          SHA_PATH="apk-distribution/app-debug.apk.sha256"

          if [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "::error::Missing or empty APK at $APK_PATH"
            exit 1
          fi

          if [ ! -f "$SHA_PATH" ] || [ ! -s "$SHA_PATH" ]; then
            echo "::error::Missing or empty checksum file at $SHA_PATH"
            exit 1
          fi

          (cd apk-distribution && sha256sum -c app-debug.apk.sha256)
          unzip -tq "$APK_PATH"

          APK_SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          APK_BYTES="$(stat -c%s "$APK_PATH")"
          APK_SIZE_HUMAN="$(numfmt --to=iec-i --suffix=B "$APK_BYTES")"

          echo "sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          echo "size_human=$APK_SIZE_HUMAN" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$APK_BYTES" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload APK
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          APK_PATH="apk-distribution/app-debug.apk"
          APK_SHA256="${{ steps.validate.outputs.sha256 }}"
          APK_SIZE="${{ steps.validate.outputs.size_human }}"

          RELEASE_NOTES="$(printf 'Prebuilt Android Debug APK compiled in Google AI Studio.\n\n- **Asset**: `app-debug.apk`\n- **Size**: %s (%s bytes)\n- **SHA-256**: `%s`\n- **Direct Download**: https://github.com/%s/releases/latest/download/app-debug.apk\n' "$APK_SIZE" "${{ steps.validate.outputs.size_bytes }}" "$APK_SHA256" "$GITHUB_REPOSITORY")"

          gh release create "$TAG" "$APK_PATH" \
            --title "$TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          {
            echo "## GitHub Release Published"
            echo ""
            echo "| Field | Value |"
            echo "| :--- | :--- |"
            echo "| **Release Tag** | \`${TAG}\` |"
            echo "| **APK Asset** | \`app-debug.apk\` |"
            echo "| **APK Size** | ${APK_SIZE} (${{ steps.validate.outputs.size_bytes }} bytes) |"
            echo "| **SHA-256** | \`${APK_SHA256}\` |"
            echo "| **Release Page** | ${RELEASE_URL} |"
            echo "| **Direct Download (Latest)** | ${DIRECT_URL} |"
          } >> "$GITHUB_STEP_SUMMARY"
